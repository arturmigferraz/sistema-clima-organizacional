<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Clima Organizacional | Consultora</title>
  <style>
    :root {
      --ink: #14252d;
      --muted: #60717a;
      --line: #d9e4e6;
      --paper: #f7faf9;
      --white: #ffffff;
      --brand: #1f4e5f;
      --teal: #008f95;
      --green: #2e7d32;
      --amber: #b7791f;
      --red: #b3261e;
      --blue: #2458a7;
      --shadow: 0 10px 28px rgba(20, 37, 45, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      letter-spacing: 0;
    }
    header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .bar {
      max-width: 1320px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brandmark {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 260px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(0,143,149,.96), rgba(31,78,95,.98)),
        radial-gradient(circle at 25% 25%, rgba(255,255,255,.35), transparent 35%);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 16px;
    }
    h1, h2, h3, h4 { margin: 0; color: var(--brand); }
    h1 { font-size: 20px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    button, .btn {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    button.primary { background: var(--brand); color: white; border-color: var(--brand); }
    button.teal { background: var(--teal); color: white; border-color: var(--teal); }
    button.danger { color: var(--red); border-color: #f0c5c1; }
    button.active { background: #e7f2f3; border-color: var(--teal); color: var(--brand); font-weight: 700; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    main { max-width: 1320px; margin: 0 auto; padding: 22px 24px 48px; }
    .grid { display: grid; gap: 16px; }
    .cols-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .panel h2 { font-size: 18px; margin-bottom: 10px; }
    .panel h3 { font-size: 15px; margin-bottom: 8px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      background: white;
      color: var(--ink);
    }
    textarea { min-height: 88px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .kpi {
      border-left: 4px solid var(--teal);
      background: #fbfdfd;
      padding: 12px;
      border-radius: 8px;
      min-height: 94px;
    }
    .kpi .value { font-size: 28px; font-weight: 800; color: var(--brand); margin-top: 7px; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef4f4;
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }
    .tag.good { background: #e7f3e8; color: var(--green); }
    .tag.warn { background: #fff4da; color: var(--amber); }
    .tag.risk { background: #fce9e7; color: var(--red); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--brand); font-size: 12px; background: #f0f6f6; }
    .hide { display: none !important; }
    .barline {
      height: 10px;
      background: #e9eef0;
      border-radius: 999px;
      overflow: hidden;
      min-width: 120px;
    }
    .fill { height: 100%; background: var(--teal); width: 0%; }
    .fill.good { background: var(--green); }
    .fill.warn { background: var(--amber); }
    .fill.risk { background: var(--red); }
    .question {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 260px;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .scale label {
      margin: 0;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      background: white;
    }
    .scale input { width: auto; margin: 0 0 5px; display: block; margin-left: auto; margin-right: auto; }
    .dimension-title {
      margin-top: 18px;
      padding: 10px 12px;
      background: #eaf4f4;
      border-left: 4px solid var(--teal);
      border-radius: 8px;
      color: var(--brand);
      font-weight: 800;
    }
    .report {
      background: white;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .report h2 { margin-top: 24px; }
    .report p { line-height: 1.42; }
    .source-list li { margin-bottom: 7px; }
    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      text-align: center;
      border-radius: 8px;
      color: var(--muted);
      background: #fbfdfd;
    }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    canvas { width: 100%; height: 240px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    @media (max-width: 900px) {
      .cols-2, .cols-3, .cols-4, .field-row { grid-template-columns: 1fr; }
      .bar { align-items: flex-start; flex-direction: column; }
      .tabs { justify-content: flex-start; }
      .question { grid-template-columns: 1fr; }
    }
    @media print {
      header, .no-print, #adminViews > section:not(#view-report), #surveyView { display: none !important; }
      body { background: white; }
      main { padding: 0; max-width: none; }
      .report { border: 0; box-shadow: none; padding: 0; }
      .panel { box-shadow: none; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <header class="no-print">
    <div class="bar">
      <div class="brandmark">
        <div class="logo">CO</div>
        <div>
          <h1>Sistema de Clima Organizacional</h1>
          <div class="sub">Gestão multiempresa, questionário, análise automática e relatório cliente</div>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button data-view="setup" class="active">Empresas</button>
        <button data-view="questionnaire">Questionário</button>
        <button data-view="responses">Respostas</button>
        <button data-view="analytics">Análise</button>
        <button data-view="report">Relatório</button>
        <button data-view="method">Método</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="surveyView" class="hide"></section>
    <div id="adminViews">
      <section id="view-setup" class="view"></section>
      <section id="view-questionnaire" class="view hide"></section>
      <section id="view-responses" class="view hide"></section>
      <section id="view-analytics" class="view hide"></section>
      <section id="view-report" class="view hide"></section>
      <section id="view-method" class="view hide"></section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const DIMENSIONS = [
      { id: "D01", name: "Visão sobre a empresa", questions: [
        "A organização tem uma imagem e reputação positivas no mercado.",
        "Tenho orgulho em pertencer a esta organização.",
        "Conheço os objetivos e o rumo da organização para os próximos 12 meses.",
        "As decisões são tomadas de forma clara e coerente com a estratégia."
      ]},
      { id: "D02", name: "Função, autonomia e clareza", questions: [
        "A função que desempenho é motivante.",
        "Consigo aplicar as minhas competências no trabalho que realizo.",
        "Sei exatamente quais são as minhas atividades e responsabilidades.",
        "Tenho autonomia adequada para desempenhar as minhas tarefas."
      ]},
      { id: "D03", name: "Papel e contributo individual", questions: [
        "Sei o que é esperado da minha função.",
        "Percebo como o meu trabalho contribui para os objetivos da organização.",
        "Conheço as funções das pessoas com quem interajo diretamente.",
        "Sinto que o meu contributo é reconhecido."
      ]},
      { id: "D04", name: "Liderança e apoio da chefia", questions: [
        "A minha chefia direta apoia-me no trabalho que desenvolvo.",
        "Existe cooperação entre chefias e equipas.",
        "A gestão de topo está disponível e atenta às questões do dia-a-dia.",
        "Recebo feedback útil para melhorar o meu desempenho."
      ]},
      { id: "D05", name: "Trabalho de equipa e cooperação", questions: [
        "Existe espírito de entreajuda e cooperação entre colegas.",
        "As equipas colaboram bem entre si para resolver problemas.",
        "A organização promove momentos de convívio e proximidade.",
        "Os conflitos são tratados de forma construtiva."
      ]},
      { id: "D06", name: "Comunicação e alinhamento", questions: [
        "Existe boa comunicação entre colaboradores.",
        "Tenho acesso à informação necessária para executar o meu trabalho.",
        "A informação flui bem entre departamentos na resolução de problemas.",
        "As mudanças relevantes são comunicadas de forma atempada."
      ]},
      { id: "D07", name: "Remuneração, equidade e condições", questions: [
        "O horário de trabalho ajusta-se à minha vida pessoal/familiar.",
        "A organização transmite segurança e estabilidade.",
        "As minhas condições salariais são ajustadas à função que desempenho.",
        "A minha remuneração é equivalente à de colegas com experiência e funções comparáveis."
      ]},
      { id: "D08", name: "Carreira e desenvolvimento", questions: [
        "A aquisição de competências aumenta as minhas oportunidades de progressão.",
        "A experiência e antiguidade são consideradas na evolução profissional.",
        "A definição de objetivos contribui para melhorar o meu desempenho.",
        "Vejo oportunidades de crescimento dentro da organização."
      ]},
      { id: "D09", name: "Formação e aprendizagem", questions: [
        "Recebo formação ajustada ao desenvolvimento da minha função.",
        "A formação recebida é útil para o meu trabalho.",
        "Tenho oportunidade de aprender com colegas e chefias.",
        "A organização investe no desenvolvimento das pessoas."
      ]},
      { id: "D10", name: "Recursos, instalações e ferramentas", questions: [
        "As condições disponíveis para executar o meu trabalho são adequadas.",
        "Tenho acesso aos recursos necessários para realizar o meu trabalho.",
        "As ferramentas digitais/sistemas facilitam o trabalho diário.",
        "Os processos internos são simples e ajudam a trabalhar melhor."
      ]},
      { id: "D11", name: "Saúde, segurança e bem-estar", questions: [
        "As condições de higiene, segurança e saúde no trabalho são adequadas.",
        "A carga de trabalho é equilibrada e sustentável.",
        "Consigo manter um bom equilíbrio entre vida profissional e pessoal.",
        "A organização preocupa-se com o bem-estar das pessoas."
      ]},
      { id: "D12", name: "Gestão do tempo, assiduidade e engagement", questions: [
        "As regras de assiduidade e pontualidade são claras.",
        "O registo de horas é usado de forma justa e transparente.",
        "A flexibilidade/remoto/híbrido é gerida de forma equilibrada.",
        "Recomendaria esta organização como um bom lugar para trabalhar."
      ]}
    ];

    const SOURCES = [
      {
        name: "Pew Research Center - Writing Survey Questions",
        url: "https://www.pewresearch.org/our-methods/u-s-surveys/writing-survey-questions/",
        use: "Perguntas simples, evitar formulações ambíguas, pré-teste, atenção à ordem das perguntas e consistência para medir evolução."
      },
      {
        name: "GOV.UK Service Manual - Informed consent for research",
        url: "https://www.gov.uk/service-manual/user-research/getting-users-consent-for-research",
        use: "Consentimento informado: quem recolhe, finalidade, dados recolhidos, uso dos resultados, voluntariedade, retenção e direitos."
      },
      {
        name: "GOV.UK Service Manual - Managing research data and participant privacy",
        url: "https://www.gov.uk/service-manual/user-research/managing-user-research-data-participant-privacy",
        use: "Minimização de dados, uso dentro da finalidade consentida, retenção definida e eliminação quando deixa de ser necessário."
      },
      {
        name: "NIST Privacy Framework",
        url: "https://www.nist.gov/privacy-framework",
        use: "Gestão de risco de privacidade, proteção de indivíduos e desenho de processos escaláveis com controlo de dados."
      },
      {
        name: "Online Surveys - Respondent anonymity",
        url: "https://www.onlinesurveys.ac.uk/help-support/respondent-anonymity-and-online-surveys/",
        use: "Anonimato depende também do desenho: evitar identificadores diretos e combinações demográficas demasiado específicas."
      }
    ];

    const STORAGE_KEY = "consultora_clima_sistema_v2";
    const SUPABASE_KEY = "consultora_clima_supabase_v1";
    const supaConfig = loadSupabaseConfig();
    let supa = null;
    let supaUser = null;
    const state = loadState();
    let activeCompanyId = state.activeCompanyId || null;

    function loadSupabaseConfig() {
      const params = new URLSearchParams(location.search);
      if (params.get("supaUrl") && params.get("supaKey")) {
        return { enabled: true, url: params.get("supaUrl"), anonKey: params.get("supaKey") };
      }
      try {
        return JSON.parse(localStorage.getItem(SUPABASE_KEY)) || { enabled: false, url: "", anonKey: "" };
      } catch (e) {
        return { enabled: false, url: "", anonKey: "" };
      }
    }

    function saveSupabaseConfig() {
      localStorage.setItem(SUPABASE_KEY, JSON.stringify(supaConfig));
    }

    function normalizeSupabaseUrl(url) {
      return String(url || "").trim().replace(/\/+$/, "");
    }

    function validateSupabaseConfig() {
      const url = normalizeSupabaseUrl(supaConfig.url);
      const key = String(supaConfig.anonKey || "").trim();
      if (!supaConfig.enabled) return { ok: false, message: "Ative a opcao Usar Supabase." };
      if (!url || !key) return { ok: false, message: "Preencha o Project URL e a Publishable/Anon key." };
      if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) {
        return { ok: false, message: "O Project URL deve ter o formato https://xxxxxxxxxxxx.supabase.co. Nao use o link do GitHub, nem o link do dashboard do Supabase." };
      }
      if (!(key.startsWith("sb_publishable_") || key.startsWith("eyJ"))) {
        return { ok: false, message: "Use uma Publishable key (sb_publishable_...) ou a legacy anon public key (eyJ...). Nunca use a secret/service_role key." };
      }
      supaConfig.url = url;
      supaConfig.anonKey = key;
      return { ok: true };
    }

    function getSupabase() {
      if (!supaConfig.enabled || !supaConfig.url || !supaConfig.anonKey || !window.supabase) return null;
      const valid = validateSupabaseConfig();
      if (!valid.ok) throw new Error(valid.message);
      if (!supa) supa = window.supabase.createClient(supaConfig.url, supaConfig.anonKey);
      return supa;
    }

    async function refreshSupabaseUser() {
      const client = getSupabase();
      if (!client) { supaUser = null; return null; }
      const { data } = await client.auth.getUser();
      supaUser = data?.user || null;
      return supaUser;
    }

    function defaultCompany() {
      return {
        id: "demo-" + Math.random().toString(36).slice(2, 8),
        name: "Cliente Demonstração",
        sector: "Serviços / Tecnologia",
        expected: 80,
        departments: ["Administração", "Sistemas de Informação", "Consultoria", "Comercial", "Design", "Operações"],
        areas: ["Gestão/Administração", "Técnica/Operacional", "Comercial", "Suporte", "Consultoria", "Design/Produto"],
        locations: ["Sede", "Unidade 2", "Remoto/Híbrido"],
        createdAt: new Date().toISOString(),
        responses: sampleResponses()
      };
    }

    function sampleResponses() {
      const genders = ["Mulher", "Homem", "Mulher", "Homem", "Mulher", "Prefiro não responder"];
      const ages = ["26-35", "36-45", "26-35", "46-55", "18-25", "36-45"];
      const areas = ["Técnica/Operacional", "Consultoria", "Comercial", "Suporte", "Design/Produto", "Gestão/Administração"];
      const tenures = ["1-2 anos", "3-6 anos", "7-15 anos", "<1 ano", "3-6 anos", ">15 anos"];
      const rows = [];
      for (let i = 0; i < 18; i++) {
        const base = 3 + (i % 5) * 0.25;
        const answers = {};
        let qn = 1;
        DIMENSIONS.forEach((d, di) => {
          d.questions.forEach(() => {
            let val = Math.round(Math.max(1, Math.min(5, base + ((di % 4) - 1.5) * .25 + ((i + di) % 3 === 0 ? -.6 : .2))));
            if (["D06", "D07", "D11"].includes(d.id)) val = Math.max(1, val - 1);
            answers["Q" + String(qn).padStart(2, "0")] = val;
            qn++;
          });
        });
        rows.push({
          id: "R" + String(i + 1).padStart(3, "0"),
          date: new Date(Date.now() - i * 86400000).toISOString(),
          consent: true,
          gender: genders[i % genders.length],
          age: ages[i % ages.length],
          area: areas[i % areas.length],
          department: ["Sistemas de Informação", "Consultoria", "Comercial", "Design", "Operações"][i % 5],
          location: ["Sede", "Unidade 2", "Remoto/Híbrido"][i % 3],
          tenure: tenures[i % tenures.length],
          workMode: ["Presencial", "Híbrido", "Remoto"][i % 3],
          enps: [6, 7, 8, 9, 10, 6, 8, 9][i % 8],
          open1: i % 3 === 0 ? "Boa relação entre colegas e orgulho no produto." : "",
          open2: i % 4 === 0 ? "Comunicação, prioridades e processos internos." : "",
          open3: i % 5 === 0 ? "Mais feedback das chefias e melhor planeamento." : "",
          answers
        });
      }
      return rows;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      const initial = { companies: [], activeCompanyId: null };
      const demo = defaultCompany();
      initial.companies.push(demo);
      initial.activeCompanyId = demo.id;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }

    function saveState() {
      state.activeCompanyId = activeCompanyId;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function activeCompany() {
      return state.companies.find(c => c.id === activeCompanyId) || state.companies[0];
    }

    function surveyUrl(c) {
      const base = location.href.split("#")[0].split("?")[0];
      if (c.publicToken && supaConfig.enabled && supaConfig.url && supaConfig.anonKey) {
        const qs = new URLSearchParams({ supaUrl: supaConfig.url, supaKey: supaConfig.anonKey }).toString();
        return `${base}?${qs}#survey/supa/${c.publicToken}`;
      }
      return `${base}#survey/${c.id}`;
    }

    function isSupabaseSurveyReady(c) {
      return Boolean(c?.publicToken && c?.remoteSurveyId && supaConfig.enabled && supaConfig.url && supaConfig.anonKey);
    }

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
    }

    function qid(n) { return "Q" + String(n).padStart(2, "0"); }
    function allQuestions() {
      const arr = [];
      let n = 1;
      DIMENSIONS.forEach(d => d.questions.forEach(q => arr.push({ id: qid(n++), dimension: d.name, dimensionId: d.id, text: q })));
      return arr;
    }

    function avg(values) {
      const nums = values.map(Number).filter(Number.isFinite);
      return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
    }

    function fmt(n, d = 1) { return Number.isFinite(n) ? n.toFixed(d).replace(".", ",") : "0,0"; }

    function classify(score) {
      if (score >= 4) return { label: "Ponto forte", cls: "good", action: "Consolidar e comunicar boas práticas." };
      if (score >= 3.3) return { label: "Atenção", cls: "warn", action: "Acompanhar e clarificar expectativas." };
      if (score >= 2.8) return { label: "Risco", cls: "risk", action: "Investigar causas e definir ações rápidas." };
      return { label: "Prioridade crítica", cls: "risk", action: "Intervenção prioritária com plano dedicado." };
    }

    function compute(company = activeCompany()) {
      const responses = company?.responses || [];
      const qs = allQuestions();
      const dimensionRows = DIMENSIONS.map(d => {
        const ids = qs.filter(q => q.dimensionId === d.id).map(q => q.id);
        const values = [];
        responses.forEach(r => ids.forEach(id => values.push(r.answers?.[id])));
        const score = avg(values);
        return { id: d.id, name: d.name, score, count: values.filter(Number.isFinite).length, ...classify(score) };
      });
      const global = avg(dimensionRows.map(d => d.score).filter(Boolean));
      const enpsVals = responses.map(r => Number(r.enps)).filter(Number.isFinite);
      const promoters = enpsVals.filter(v => v >= 9).length;
      const detractors = enpsVals.filter(v => v <= 6).length;
      const enps = enpsVals.length ? Math.round(((promoters - detractors) / enpsVals.length) * 100) : 0;
      const low = [...dimensionRows].sort((a, b) => a.score - b.score).slice(0, 4);
      const high = [...dimensionRows].sort((a, b) => b.score - a.score).slice(0, 4);
      return { responses, dimensionRows, global, enps, high, low };
    }

    function distribution(rows, key) {
      const out = {};
      rows.forEach(r => {
        const k = r[key] || "N/D";
        out[k] = (out[k] || 0) + 1;
      });
      return Object.entries(out).sort((a, b) => b[1] - a[1]);
    }

    function listNames(rows) {

    function makeCriticalAnalysis(a) {
      const out = [];
      if (!a.responses.length) return ["Ainda não existem respostas suficientes para análise crítica."];
      out.push(`A média global de ${fmt(a.global)} indica ${classify(a.global).label.toLowerCase()}. Esta leitura deve ser cruzada com a distribuição por dimensão, porque uma média global aceitável pode esconder riscos específicos em comunicação, liderança, equidade ou bem-estar.`);
      const low = a.low[0];
      if (low) out.push(`A principal zona de vulnerabilidade é "${low.name}", com média ${fmt(low.score)}. Esta dimensão deve ser tratada como prioridade de gestão, porque tende a influenciar motivação, confiança e retenção.`);
      const communication = a.dimensionRows.find(d => d.id === "D06");
      const leadership = a.dimensionRows.find(d => d.id === "D04");
      const wellbeing = a.dimensionRows.find(d => d.id === "D11");
      if (communication?.score < 3.5) out.push("A comunicação apresenta sinais de fragilidade. Em estudos de clima, falhas de informação e alinhamento costumam amplificar perceções negativas sobre liderança, justiça interna e capacidade de execução.");
      if (leadership?.score < 3.5) out.push("A liderança deve ser olhada como alavanca de melhoria. Mesmo quando existem bons indicadores técnicos, a falta de feedback, presença e apoio da chefia reduz envolvimento e clareza de prioridades.");
      if (wellbeing?.score < 3.5) out.push("A dimensão de saúde, segurança e bem-estar sugere necessidade de intervenção sobre carga de trabalho, equilíbrio e condições de trabalho, prevenindo absentismo, fadiga e perda de engagement.");
      if (a.enps < 0) out.push("O eNPS negativo indica maior peso de detratores do que promotores. Este indicador exige resposta visível da gestão e compromisso com ações de melhoria mensuráveis.");
      else if (a.enps < 30) out.push("O eNPS é moderado e deve ser acompanhado. Há margem para converter colaboradores neutros em promotores através de ações concretas nas dimensões mais frágeis.");
      else out.push("O eNPS é positivo, sugerindo uma base favorável de recomendação interna. A prioridade deve ser consolidar pontos fortes e agir nos focos de risco para manter confiança.");
      return out;
    }

    function makeActions(a) {
      const weak = a.dimensionRows.filter(d => d.score < 3.5).sort((x, y) => x.score - y.score);
      const need = weak.length ? weak.map(d => d.name).join("; ") : "Manutenção e melhoria contínua";
      const actions = [
        { term: "Curto prazo", action: "Comunicar resultados agregados e assumir 3 compromissos de melhoria.", need, metric: "Sessão realizada e compromissos publicados em 15 dias." },
        { term: "Curto prazo", action: "Fazer sessões rápidas de escuta com equipas/grupos críticos, preservando anonimato.", need: weak[0]?.name || "Validação qualitativa", metric: "Sessões realizadas; temas priorizados." },

    }

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quote = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && quote && next === '"') { cell += '"'; i++; }
        else if (ch === '"') quote = !quote;
        else if (ch === "," && !quote) { row.push(cell); cell = ""; }
        else if ((ch === "\n" || ch === "\r") && !quote) {
          if (cell || row.length) { row.push(cell); rows.push(row); row = []; cell = ""; }
          if (ch === "\r" && next === "\n") i++;
        } else cell += ch;
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }

    function normalize(s) {
      return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
    }

    function importCsvResponses(event, c) {
      const file = event.target.files[0]; if (!file) return;
      file.text().then(text => {
        const rows = parseCsv(text);
        if (rows.length < 2) return alert("CSV sem respostas.");
        const headers = rows[0].map(h => h.trim());
        const qs = allQuestions();
        const find = names => headers.findIndex(h => names.some(n => normalize(h).includes(normalize(n))));
        const idx = {
          date: find(["timestamp","carimbo","data","hora"]),
          gender: find(["genero","género","sexo"]),
          age: find(["faixa etaria","idade"]),
          area: find(["area profissional","profissao","função","funcao"]),
          department: find(["departamento","area funcional"]),
          location: find(["localizacao","localização","unidade"]),
          tenure: find(["tempo de servico","antiguidade"]),
          workMode: find(["regime"]),
          enps: find(["enps","probabilidade de recomendar","recomendar esta organizacao"])
        };
        const qIndex = {};
        qs.forEach(q => {
          qIndex[q.id] = headers.findIndex(h => normalize(h) === normalize(q.id) || normalize(h).includes(normalize(q.text).slice(0, 45)));
        });
        const imported = rows.slice(1).filter(r => r.some(Boolean)).map((r, i) => {
          const answers = {};
          qs.forEach(q => answers[q.id] = Number(r[qIndex[q.id]] || ""));
          return {
            id: "CSV" + Date.now() + "-" + i,
            date: idx.date >= 0 ? r[idx.date] : new Date().toISOString(),
            consent: true,
            gender: idx.gender >= 0 ? r[idx.gender] : "N/D",
            age: idx.age >= 0 ? r[idx.age] : "N/D",
            area: idx.area >= 0 ? r[idx.area] : "N/D",
            department: idx.department >= 0 ? r[idx.department] : "N/D",
            location: idx.location >= 0 ? r[idx.location] : "N/D",
            tenure: idx.tenure >= 0 ? r[idx.tenure] : "N/D",
            workMode: idx.workMode >= 0 ? r[idx.workMode] : "N/D",
            enps: idx.enps >= 0 ? Number(r[idx.enps]) : "",
            open1: r[find(["mais valoriza"])] || "",
            open2: r[find(["mudar com maior urgencia"])] || "",
            open3: r[find(["sugestao","sugestão"])] || "",
            answers
          };
        });
        c.responses.push(...imported);
        if (supaConfig.enabled && c.remoteSurveyId && c.publicToken && getSupabase()) {
          getSupabase().from("clima_responses").insert(imported.map(r => toSupabaseResponse(r, c.remoteSurveyId, c.publicToken)));
        }
        saveState();
        alert(`${imported.length} respostas importadas.`);
        renderResponses(c);
      });
    }

    async function loadSupabaseCompanies() {
      const client = getSupabase();
      if (!client) throw new Error("Supabase não configurado.");
      const user = await refreshSupabaseUser();
      if (!user) throw new Error("Faça login antes de carregar empresas.");
      const { data: clients, error: clientError } = await client
        .from("clima_clients")
        .select("*")
        .order("created_at", { ascending: false });
      if (clientError) throw clientError;
      const clientIds = (clients || []).map(row => row.id);
      let surveys = [];
      if (clientIds.length) {
        const { data: surveyRows, error: surveyError } = await client
          .from("clima_surveys")
          .select("*")
          .in("client_id", clientIds)
          .order("created_at", { ascending: false });
        if (surveyError) throw surveyError;
        surveys = surveyRows || [];
      }
      const companies = [];
      for (const row of clients || []) {
        const companySurveys = surveys.filter(s => s.client_id === row.id);
        const survey = companySurveys[0];
        let responses = [];
        if (companySurveys.length) {
          const surveyIds = companySurveys.map(s => s.id);
          const { data, error } = await client.from("clima_responses").select("*").in("survey_id", surveyIds).order("submitted_at", { ascending: true });
          if (error) throw error;
          responses = (data || []).map(fromSupabaseResponse);
        }
        companies.push({
          id: row.id,
          remoteClientId: row.id,
          remoteSurveyId: survey?.id || null,
          publicToken: survey?.public_token || null,
          name: row.name,
          sector: row.sector || "",
          expected: row.expected_responses || 0,
          departments: row.departments || [],
          areas: row.areas || [],
          locations: row.locations || [],
          createdAt: row.created_at,
          responses
        });
      }
      if (companies.length) {
        state.companies = companies;
        activeCompanyId = companies[0].id;
        saveState();
      }
      return {
        companies: companies.length,
        responses: companies.reduce((sum, company) => sum + (company.responses || []).length, 0)
      };
    }

        age: r.age,
        area: r.area,
        department: r.department,
        location: r.location,
        tenure: r.tenure,
        workMode: r.work_mode,
        enps: r.enps,
        open1: r.open1,
        open2: r.open2,
        open3: r.open3,
        answers: r.answers || {}
      };
    }

    function toSupabaseResponse(r, surveyId, token) {
      return {
        survey_id: surveyId,
        survey_token: token,
        consent: true,
        gender: r.gender || "N/D",
        age: r.age || "N/D",
        area: r.area || "N/D",
        department: r.department || "N/D",
        location: r.location || "N/D",
        tenure: r.tenure || "N/D",
        work_mode: r.workMode || "N/D",
        enps: Number.isFinite(Number(r.enps)) ? Number(r.enps) : null,
        answers: r.answers || {},
        open1: r.open1 || "",
        open2: r.open2 || "",
        open3: r.open3 || ""
      };
    }

    function download(filename, content, type) {

    function drawBarChart(canvas, labels, values) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
      const max = 5, left = 260, top = 24, rowH = 25, barW = w - left - 60;
      ctx.font = "13px Aptos, Arial";
      labels.forEach((label, i) => {
        const y = top + i * rowH;
        const val = values[i] || 0;
        ctx.fillStyle = "#14252d";
        ctx.fillText(label.length > 32 ? label.slice(0, 31) + "…" : label, 12, y + 14);
        ctx.fillStyle = "#e9eef0"; ctx.fillRect(left, y, barW, 13);
        ctx.fillStyle = val >= 4 ? "#2e7d32" : val >= 3.3 ? "#b7791f" : "#b3261e";
        ctx.fillRect(left, y, barW * val / max, 13);
        ctx.fillStyle = "#14252d"; ctx.fillText(fmt(val), left + barW + 12, y + 12);
      });
    }

    window.addEventListener("hashchange", () => location.reload());
    if (location.hash.startsWith("#survey/supa/")) renderSurveyFromSupabase(location.hash.split("/")[2]);
    else if (location.hash.startsWith("#survey/")) renderSurvey(location.hash.split("/")[1]);
    else setView("setup");
  </script>
</body>
</html>
